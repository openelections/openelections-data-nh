[project]
name = "openelections-data-nh"
version = "0.0.0"
description = "Scrapers and parsers that produce CSVs of New Hampshire election results for the OpenElections project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4",
    "openpyxl",
    "requests",
    "xlrd",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oe_nh"]
